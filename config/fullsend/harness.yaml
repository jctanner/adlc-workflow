# Illustrative supported-interface configuration from the proposal.
# Deployment must replace image, policy, role, provider, and timeout values.
agent: agents/adlc-workflow.md
image: registry.example/adlc-workflow@sha256:<approved-digest>
policy: policies/adlc-workflow.yaml
skills:
  - skills/adlc-workflow
  - skills/rhai-feature-refine-worker
  - skills/rhai-feature-review-worker
# Reviewer agents are supplied by the installed Claude plugin's agents/ directory.
host_files:
  - src: ${ADLC_REQUEST_PATH}
    dest: /sandbox/workspace/adlc-request.json
validation_loop:
  script: scripts/validate-adlc-result.sh
  max_iterations: 1
  feedback_mode: none
timeout_minutes: 60
