api_version: adlc.profile/v1
id: adlc-workflow
lifecycle: adlc-request-v1

context_sources:
  - id: rhai-architecture-context
    repo: https://github.com/opendatahub-io/architecture-context.git
    ref: main
    destination: .context/architecture-context
    include:
      - architecture/rhoai-*/**
      - overlays/*.md
    exclude:
      - '**/README.md'
    usage: context/rhai-architecture-context/usage.md

template:
  path: templates/rhai-request-creator/request-template.md

reviewers:
  - id: feasibility
    worker: skill:rhai-request-feasibility-review
    scoring: false
  - id: assessment
    worker: skill:rhai-request-assess
    scoring: true

# TODO: define artifact namespace, reviewers, concerns, and publication mapping.
