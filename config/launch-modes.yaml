api_version: adlc.launch-modes/v1
# Reviewed adapter and effect allowlists for each execution mode.
modes:
  production:
    trusted: true
    adapters: [jira, archive]
    effect_classes: [jira-write, archive-write]
    required_effect_classes: [jira-write, archive-write]
  local:
    trusted: false
    adapters: [jira, archive]
    effect_classes: [jira-write, archive-write]
  eval:
    trusted: false
    adapters: [archive]
    effect_classes: [archive-write]
