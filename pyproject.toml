[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adlc-workflow"
version = "0.0.0"
description = "Skeleton for the deterministic ADLC workflow"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
adlc-workflow = "adlc_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "integration: starts external services and may call a live model",
]
